name: Setup Repository Secrets

# This workflow helps set up secrets for GitHub Codespaces
# Run manually from Actions tab after forking

on:
  workflow_dispatch:
    inputs:
      setup_type:
        description: 'Setup type'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production

jobs:
  setup-info:
    runs-on: ubuntu-latest
    steps:
      - name: Instructions
        run: |
          echo "📋 INSTRUCTIONS FOR SETTING UP SECRETS"
          echo "======================================"
          echo ""
          echo "Go to: Settings → Secrets and variables → Codespaces"
          echo ""
          echo "Add these secrets:"
          echo "  OPENAI_API_KEY"
          echo "  ANTHROPIC_API_KEY"
          echo "  SUPABASE_URL"
          echo "  SUPABASE_KEY"
          echo "  SUPABASE_SERVICE_KEY"
          echo "  GOOGLE_PLACES_API_KEY"
          echo "  TAVILY_API_KEY"
          echo ""
          echo "These will be automatically available in Codespaces!"